name: Android CI


on:
  push:
    branches: [ main, master, fastlane2 ]
  pull_request:
    branches: [ main, master ]

env:
  LC_ALL: "en_US.UTF-8"
  LANG: "en_US.UTF-8"
  # Android SDK en el runner (ajusta la ruta si en tu Mac está en otro sitio)
  ANDROID_HOME: /Users/ricardogranado/Library/Android/sdk
  ANDROID_SDK_ROOT: /Users/ricardogranado/Library/Android/sdk

jobs:
  build:
    runs-on: [self-hosted, android]
    steps:
      - uses: actions/checkout@v4
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -D > app/google-services.json
      - name: Install Bundler
        run: gem install bundler
      - name: Install dependencies
        run: bundle install
      - name: Fastlane build
        run: bundle exec fastlane build

  test:
    runs-on: [self-hosted, android]
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -D > app/google-services.json
      - name: Install Bundler
        run: gem install bundler
      - name: Install dependencies
        run: bundle install
      - name: Fastlane tests
        run: bundle exec fastlane tests

  ui-test:
    runs-on: [self-hosted, android]
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -D > app/google-services.json
      - name: Install Bundler
        run: gem install bundler
      - name: Install dependencies
        run: bundle install
      - name: Fastlane ui_tests
        run: bundle exec fastlane ui_tests
