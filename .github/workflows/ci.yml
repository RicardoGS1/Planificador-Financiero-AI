name: Android CI

on:
  push:
    branches: [ main, master, Fastlane ]
  pull_request:
    branches: [ main, master ]

env:
  LC_ALL: "en_US.UTF-8"
  LANG: "en_US.UTF-8"
  # Evita el warning de Java "restricted method" / native access al ejecutar Gradle
  GRADLE_OPTS: "-J--enable-native-access=ALL-UNNAMED"

jobs:
  build:
    runs-on: [ self-hosted, android ]
    steps:
      - uses: actions/checkout@v4

      - name: Create google-services.json from secret
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Set up Android SDK environment
        run: |
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "PATH=$HOME/Library/Android/sdk/platform-tools:$PATH" >> $GITHUB_ENV

      - name: Set executable permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE"
          bundle config set --local path 'vendor/bundle'
          bundle install
          bundle update fastlane

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE"
          ./vendor/bundle/bin/fastlane build

  test:
    runs-on: [ self-hosted, android ]
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Create google-services.json from secret
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Set up Android SDK environment
        run: |
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "PATH=$HOME/Library/Android/sdk/platform-tools:$PATH" >> $GITHUB_ENV

      - name: Set executable permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE"
          bundle config set --local path 'vendor/bundle'
          bundle install
          bundle update fastlane

      - name: Run tests
        run: |
          cd "$GITHUB_WORKSPACE"
          ./vendor/bundle/bin/fastlane tests

  ui-test:
    runs-on: [ self-hosted, android ]
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Create google-services.json from secret
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Set up Android SDK environment
        run: |
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "PATH=$HOME/Library/Android/sdk/platform-tools:$PATH" >> $GITHUB_ENV

      - name: Set executable permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE"
          bundle config set --local path 'vendor/bundle'
          bundle install
          bundle update fastlane

      - name: Run UI tests
        run: |
          cd "$GITHUB_WORKSPACE"
          ./vendor/bundle/bin/fastlane ui_tests